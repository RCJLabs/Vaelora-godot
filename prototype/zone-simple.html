<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ruin Clearing — Zone Prototype</title>
  <style>
    body { margin: 0; background: #161410; color: #e8e0d0; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 8px; left: 8px; background: rgba(18,14,10,0.88);
      padding: 8px 12px; border: 1px solid #6a5a40; font-size: 13px; max-width: 240px; line-height: 1.4;
    }
    #journal {
      margin-top: 6px; font-size: 12px; color: #c0b090; min-height: 16px;
    }
    #prompt {
      position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: rgba(18,14,10,0.94); border: 1px solid #a09060; padding: 10px 16px;
      font-size: 14px; display: none; text-align: center; max-width: 85%; line-height: 1.35;
    }
    #joy {
      position: absolute; bottom: 18px; left: 18px; width: 110px; height: 110px;
      background: rgba(80,60,40,0.28); border: 2px solid rgba(180,150,90,0.55); border-radius: 50%;
    }
    #knob {
      position: absolute; width: 42px; height: 42px; background: rgba(210,170,90,0.75);
      border-radius: 50%; top: 34px; left: 34px;
    }
    #btn {
      position: absolute; bottom: 36px; right: 18px; padding: 12px 18px;
      background: #3a3224; color: #e8e0d0; border: 2px solid #b0a070; font-family: inherit; font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <b>RUIN CLEARING</b><br>
    Move with joystick<br>
    Approach glowing stones
    <div id="journal">Journal: —</div>
  </div>
  <div id="prompt"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="btn">Examine</button>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = innerWidth, H = innerHeight;
    canvas.width = W; canvas.height = H;

    let px = W/2, py = H/2 + 50;
    const speed = 2.4;

    const objects = [
      { x: -90, y: -70, w: 36, h: 52, name: "Crumbling Pillar", text: "Weathered stone covered in faint, half-erased carvings. The air feels heavier nearby.", type: "pillar" },
      { x: 100, y: -50, w: 42, h: 64, name: "Broken Tower", text: "A shattered section of tower. Something metallic glints deep in a crack.", type: "tower" },
      { x: 15, y: 80, w: 48, h: 28, name: "Mossy Altar", text: "A low platform swallowed by moss and roots. Whatever was offered here is long gone.", type: "altar" },
      { x: -40, y: 20, w: 22, h: 22, name: "Scattered Stones", text: "Loose rubble. Among the stones you notice a small, smooth river pebble that doesn't belong.", type: "rubble", item: "Strange Pebble" },
      { x: 60, y: 30, w: 18, h: 30, name: "Leaning Marker", text: "A narrow standing stone, tilted with age. Scratches on its face might once have been a path sign.", type: "marker" }
    ];

    let jx = 0, jy = 0;
    const joy = document.getElementById('joy');
    const knob = document.getElementById('knob');
    let joyActive = false;

    joy.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; }, {passive:false});
    joy.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!joyActive) return;
      const t = e.touches[0];
      const r = joy.getBoundingClientRect();
      let dx = t.clientX - r.left - 55;
      let dy = t.clientY - r.top - 55;
      const dist = Math.min(Math.hypot(dx, dy), 38);
      const ang = Math.atan2(dy, dx);
      dx = Math.cos(ang) * dist;
      dy = Math.sin(ang) * dist;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      jx = dx / 38;
      jy = dy / 38;
    }, {passive:false});
    joy.addEventListener('touchend', () => {
      joyActive = false;
      knob.style.transform = '';
      jx = jy = 0;
    });

    const keys = {};
    addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    const prompt = document.getElementById('prompt');
    const journal = document.getElementById('journal');
    let near = null;
    let lastExamined = null;

    function examine() {
      if (!near) return;
      prompt.textContent = near.text;
      lastExamined = near.name;
      journal.textContent = "Journal: Examined " + near.name;
      if (near.item) {
        journal.textContent += " — found " + near.item;
      }
      setTimeout(() => {
        if (near && near === lastNear) prompt.textContent = "[Examine] " + near.name;
      }, 3200);
    }
    let lastNear = null;

    document.getElementById('btn').addEventListener('click', examine);
    document.getElementById('btn').addEventListener('touchstart', e => {
      e.preventDefault();
      examine();
    }, {passive:false});

    function drawObject(o, ox, oy) {
      ctx.save();
      if (o.type === "pillar" || o.type === "tower") {
        ctx.fillStyle = '#5a5044';
        ctx.fillRect(ox - o.w/2, oy - o.h, o.w, o.h);
        ctx.fillStyle = '#7a6a54';
        ctx.fillRect(ox - o.w/2 + 3, oy - o.h + 4, o.w - 6, 6);
        ctx.fillStyle = '#4a4036';
        ctx.fillRect(ox - 4, oy - o.h + 12, 8, o.h - 16);
      } else if (o.type === "altar") {
        ctx.fillStyle = '#4a5a40';
        ctx.fillRect(ox - o.w/2, oy - o.h/2, o.w, o.h);
        ctx.fillStyle = '#6a7a50';
        ctx.fillRect(ox - o.w/2 + 4, oy - o.h/2 + 3, o.w - 8, 5);
      } else if (o.type === "rubble") {
        ctx.fillStyle = '#6a6050';
        ctx.beginPath();
        ctx.arc(ox, oy, o.w/2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#8a7a60';
        ctx.fillRect(ox - 6, oy - 4, 5, 4);
        ctx.fillRect(ox + 2, oy + 1, 4, 3);
      } else {
        ctx.fillStyle = '#5a5848';
        ctx.fillRect(ox - o.w/2, oy - o.h, o.w, o.h);
        ctx.fillStyle = '#7a7860';
        ctx.fillRect(ox - 2, oy - o.h + 2, 4, 8);
      }
      ctx.restore();
    }

    function draw() {
      // Sky / outer
      ctx.fillStyle = '#1a1814';
      ctx.fillRect(0, 0, W, H);

      // Ground
      ctx.fillStyle = '#2e3428';
      ctx.fillRect(30, 30, W - 60, H - 60);

      // Subtle ground variation
      ctx.fillStyle = 'rgba(40,50,30,0.4)';
      for (let i = 0; i < 12; i++) {
        ctx.fillRect(60 + (i*47)% (W-120), 50 + (i*73)% (H-100), 30, 8);
      }

      // Border
      ctx.strokeStyle = '#4a4438';
      ctx.lineWidth = 4;
      ctx.strokeRect(36, 36, W - 72, H - 72);

      // Objects
      objects.forEach(o => {
        const ox = W/2 + o.x;
        const oy = H/2 + o.y;
        drawObject(o, ox, oy);

        const d = Math.hypot(px - ox, py - (oy - o.h/3));
        if (d < 52) {
          ctx.strokeStyle = '#d0b060';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 3]);
          ctx.beginPath();
          ctx.arc(ox, oy - o.h/4, Math.max(o.w, o.h)/2 + 8, 0, Math.PI*2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // Player
      ctx.fillStyle = '#4a5a68';
      ctx.beginPath();
      ctx.ellipse(px, py, 11, 14, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#3a4a38';
      ctx.fillRect(px - 8, py - 20, 16, 8); // cloak/shoulders
      ctx.fillStyle = '#2a3a48';
      ctx.beginPath();
      ctx.arc(px, py - 16, 6, 0, Math.PI*2);
      ctx.fill();

      // Nearest check
      near = null;
      let best = 50;
      objects.forEach(o => {
        const ox = W/2 + o.x;
        const oy = H/2 + o.y;
        const d = Math.hypot(px - ox, py - oy);
        if (d < best) { best = d; near = o; }
      });
      lastNear = near;

      if (near) {
        prompt.style.display = 'block';
        if (!prompt.textContent.includes(near.name) || prompt.textContent.startsWith("[Examine]")) {
          prompt.textContent = "[Examine] " + near.name;
        }
      } else {
        prompt.style.display = 'none';
      }
    }

    function update() {
      let vx = jx, vy = jy;
      if (keys['w'] || keys['arrowup']) vy = -1;
      if (keys['s'] || keys['arrowdown']) vy = 1;
      if (keys['a'] || keys['arrowleft']) vx = -1;
      if (keys['d'] || keys['arrowright']) vx = 1;

      px += vx * speed;
      py += vy * speed;
      px = Math.max(60, Math.min(W - 60, px));
      py = Math.max(60, Math.min(H - 60, py));

      draw();
      requestAnimationFrame(update);
    }
    update();

    addEventListener('resize', () => {
      W = innerWidth; H = innerHeight;
      canvas.width = W; canvas.height = H;
    });
  </script>
</body>
</html>
