<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zone Prototype (Simple)</title>
  <style>
    body { margin: 0; background: #1c1a16; color: #e8e0d0; font-family: monospace; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 8px; left: 8px; background: rgba(20,16,12,0.85);
      padding: 8px 12px; border: 1px solid #7a6a50; font-size: 13px; max-width: 220px;
    }
    #prompt {
      position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(20,16,12,0.92); border: 1px solid #a09060; padding: 8px 14px;
      font-size: 14px; display: none; text-align: center; max-width: 80%;
    }
    #joy {
      position: absolute; bottom: 16px; left: 16px; width: 100px; height: 100px;
      background: rgba(100,80,50,0.25); border: 2px solid rgba(180,160,100,0.5); border-radius: 50%;
    }
    #knob {
      position: absolute; width: 40px; height: 40px; background: rgba(200,170,100,0.7);
      border-radius: 50%; top: 30px; left: 30px;
    }
    #btn {
      position: absolute; bottom: 30px; right: 16px; padding: 10px 16px;
      background: #3a3228; color: #e8e0d0; border: 2px solid #a09060; font-family: inherit; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ui"><b>RUIN CLEARING</b><br>Joystick to move<br>Get close & Examine</div>
  <div id="prompt"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="btn">Examine</button>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;

    // Player
    let px = W/2, py = H/2 + 40;
    const speed = 2.2;

    // Zone objects (relative to center)
    const objects = [
      { x: -80, y: -60, r: 28, name: "Crumbling Pillar", text: "Ancient stone covered in faint carvings. The air feels heavier here." },
      { x: 90, y: -40, r: 32, name: "Tall Ruin", text: "A broken tower section. Something glints in the cracks." },
      { x: 10, y: 70, r: 26, name: "Overgrown Altar", text: "A low stone platform half-swallowed by moss. Old offerings long gone." }
    ];

    // Joystick
    let jx = 0, jy = 0;
    const joy = document.getElementById('joy');
    const knob = document.getElementById('knob');
    let joyActive = false;

    joy.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; }, {passive:false});
    joy.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!joyActive) return;
      const t = e.touches[0];
      const r = joy.getBoundingClientRect();
      let dx = t.clientX - r.left - 50;
      let dy = t.clientY - r.top - 50;
      const dist = Math.min(Math.hypot(dx, dy), 35);
      const ang = Math.atan2(dy, dx);
      dx = Math.cos(ang) * dist;
      dy = Math.sin(ang) * dist;
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      jx = dx / 35;
      jy = dy / 35;
    }, {passive:false});
    joy.addEventListener('touchend', () => {
      joyActive = false;
      knob.style.transform = '';
      jx = jy = 0;
    });

    // Desktop keys
    const keys = {};
    addEventListener('keydown', e => keys[e.key] = true);
    addEventListener('keyup', e => keys[e.key] = false);

    // Interaction
    const prompt = document.getElementById('prompt');
    let near = null;

    document.getElementById('btn').addEventListener('click', () => {
      if (near) {
        prompt.textContent = near.text;
        setTimeout(() => { if (near) prompt.textContent = "[Examine] " + near.name; }, 3000);
      }
    });
    document.getElementById('btn').addEventListener('touchstart', e => {
      e.preventDefault();
      document.getElementById('btn').click();
    }, {passive:false});

    function draw() {
      // Background
      ctx.fillStyle = '#2a2820';
      ctx.fillRect(0, 0, W, H);

      // Ground texture feel
      ctx.fillStyle = '#3a4030';
      ctx.fillRect(40, 40, W-80, H-80);

      // Zone border
      ctx.strokeStyle = '#5a5040';
      ctx.lineWidth = 3;
      ctx.strokeRect(50, 50, W-100, H-100);

      // Objects
      objects.forEach(o => {
        const ox = W/2 + o.x;
        const oy = H/2 + o.y;
        ctx.fillStyle = '#6a6050';
        ctx.fillRect(ox - o.r/2, oy - o.r, o.r, o.r * 1.4);
        ctx.fillStyle = '#8a7a60';
        ctx.fillRect(ox - o.r/2 + 4, oy - o.r + 4, o.r - 8, 8);

        // Glow if near
        const d = Math.hypot(px - ox, py - oy);
        if (d < 50) {
          ctx.strokeStyle = '#c0a060';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(ox, oy, o.r + 6, 0, Math.PI*2);
          ctx.stroke();
        }
      });

      // Player
      ctx.fillStyle = '#5a6a78';
      ctx.beginPath();
      ctx.arc(px, py, 12, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#3a4a58';
      ctx.fillRect(px-6, py-18, 12, 10); // head-ish

      // Update nearest
      near = null;
      let best = 48;
      objects.forEach(o => {
        const ox = W/2 + o.x;
        const oy = H/2 + o.y;
        const d = Math.hypot(px - ox, py - oy);
        if (d < best) { best = d; near = o; }
      });
      if (near) {
        prompt.style.display = 'block';
        if (!prompt.textContent.startsWith(near.text.slice(0,10))) {
          prompt.textContent = "[Examine] " + near.name;
        }
      } else {
        prompt.style.display = 'none';
      }
    }

    function update() {
      let vx = jx, vy = jy;
      if (keys['w'] || keys['ArrowUp']) vy = -1;
      if (keys['s'] || keys['ArrowDown']) vy = 1;
      if (keys['a'] || keys['ArrowLeft']) vx = -1;
      if (keys['d'] || keys['ArrowRight']) vx = 1;

      px += vx * speed;
      py += vy * speed;

      // Soft bounds
      px = Math.max(70, Math.min(W-70, px));
      py = Math.max(70, Math.min(H-70, py));

      draw();
      requestAnimationFrame(update);
    }
    update();

    addEventListener('resize', () => {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
    });
  </script>
</body>
</html>
