<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>High-Fantasy Sandbox — Prototype</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #ddd; font-family: sans-serif; touch-action: none; }
    #info {
      position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
      padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 260px; z-index: 20;
    }
    #joystick {
      position: absolute; bottom: 40px; left: 30px; width: 110px; height: 110px;
      background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
      z-index: 20;
    }
    #knob {
      position: absolute; width: 46px; height: 46px; background: rgba(255,255,255,0.55);
      border-radius: 50%; top: 32px; left: 32px;
    }
    #attack {
      position: absolute; bottom: 50px; right: 30px; width: 68px; height: 68px;
      background: rgba(180,50,50,0.85); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
      z-index: 20; color: white; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Fantasy Prototype</b><br>
    <span id="hint">Joystick = move<br>Drag right side = look<br>Attack button</span>
  </div>
  <div id="joystick"><div id="knob"></div></div>
  <div id="attack">Attack</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6a8499);
    scene.fog = new THREE.FogExp2(0x8aa0b0, 0.018);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.6, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x556677, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5e0, 0.85);
    sun.position.set(15, 25, 10);
    sun.castShadow = true;
    scene.add(sun);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0x3d5c45, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Trees
    function tree(x, z) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.35, 3.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x5a4030 })
      );
      trunk.position.set(x, 1.75, z);
      trunk.castShadow = true;
      scene.add(trunk);
      const top = new THREE.Mesh(
        new THREE.ConeGeometry(1.8, 4, 7),
        new THREE.MeshStandardMaterial({ color: 0x2e6b42 })
      );
      top.position.set(x, 4.5, z);
      top.castShadow = true;
      scene.add(top);
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 10 + Math.random() * 16;
      tree(Math.cos(a) * d, Math.sin(a) * d);
    }

    // Ruins
    function pillar(x, z, h) {
      const p = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.6, h, 6),
        new THREE.MeshStandardMaterial({ color: 0x9a9a88, roughness: 0.85 })
      );
      p.position.set(x, h / 2, z);
      p.castShadow = true;
      scene.add(p);
    }
    pillar(-5, -3, 6);
    pillar(-2, -5, 4.5);
    pillar(1.5, -4, 7);
    pillar(4, -2, 3.5);

    // Enemy
    const enemy = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.8, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x993333 })
    );
    enemy.position.set(3, 0.9, -1);
    enemy.castShadow = true;
    scene.add(enemy);
    let hp = 3;

    // Movement state
    let mx = 0, mz = 0;
    let yaw = 0, pitch = 0;

    // Joystick
    const joy = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    let joyOn = false;

    joy.addEventListener('touchstart', e => {
      e.preventDefault();
      joyOn = true;
    }, { passive: false });

    joy.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!joyOn) return;
      const t = e.touches[0];
      const r = joy.getBoundingClientRect();
      let dx = t.clientX - r.left - 55;
      let dy = t.clientY - r.top - 55;
      const len = Math.min(Math.hypot(dx, dy), 38);
      const ang = Math.atan2(dy, dx);
      dx = Math.cos(ang) * len;
      dy = Math.sin(ang) * len;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      mx = dx / 38;
      mz = -dy / 38;
    }, { passive: false });

    joy.addEventListener('touchend', () => {
      joyOn = false;
      knob.style.transform = 'translate(0,0)';
      mx = mz = 0;
    });

    // Look (right side)
    let looking = false, lx = 0, ly = 0;
    document.body.addEventListener('touchstart', e => {
      if (e.target.closest('#joystick') || e.target.closest('#attack')) return;
      if (e.touches[0].clientX > innerWidth * 0.45) {
        looking = true;
        lx = e.touches[0].clientX;
        ly = e.touches[0].clientY;
      }
    });
    document.body.addEventListener('touchmove', e => {
      if (!looking) return;
      const t = e.touches[0];
      yaw -= (t.clientX - lx) * 0.006;
      pitch -= (t.clientY - ly) * 0.006;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
      lx = t.clientX;
      ly = t.clientY;
    });
    document.body.addEventListener('touchend', () => looking = false);

    // Attack
    document.getElementById('attack').addEventListener('touchstart', e => {
      e.preventDefault();
      const d = camera.position.distanceTo(enemy.position);
      if (d < 3.5 && enemy.visible) {
        hp--;
        enemy.material.color.setHex(0xff5555);
        setTimeout(() => enemy.material.color.setHex(0x993333), 120);
        if (hp <= 0) {
          enemy.visible = false;
          document.getElementById('info').innerHTML += '<br><span style="color:#9f9">Defeated!</span>';
        }
      }
    }, { passive: false });

    // Desktop fallback (simple)
    const keys = {};
    addEventListener('keydown', e => keys[e.code] = true);
    addEventListener('keyup', e => keys[e.code] = false);
    addEventListener('click', () => {
      if (!isMobile) {
        const d = camera.position.distanceTo(enemy.position);
        if (d < 3.5 && enemy.visible) {
          hp--;
          if (hp <= 0) enemy.visible = false;
        }
      }
    });

    function loop() {
      requestAnimationFrame(loop);

      // Apply rotation
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Move
      const spd = 0.12;
      if (isMobile) {
        const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        f.y = 0; f.normalize();
        const r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        r.y = 0; r.normalize();
        camera.position.addScaledVector(f, mz * spd);
        camera.position.addScaledVector(r, mx * spd);
      } else {
        if (keys['KeyW']) camera.translateZ(-spd);
        if (keys['KeyS']) camera.translateZ(spd);
        if (keys['KeyA']) camera.translateX(-spd);
        if (keys['KeyD']) camera.translateX(spd);
      }
      camera.position.y = 1.6;

      // Telegraph
      if (enemy.visible && camera.position.distanceTo(enemy.position) < 5) {
        enemy.scale.y = 1 + Math.sin(Date.now() * 0.012) * 0.07;
      } else enemy.scale.y = 1;

      renderer.render(scene, camera);
    }
    loop();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
